services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: mdg-clickhouse
    profiles: ["core"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      # Нативный протокол 9000 наружу не публикуем (занят Portainer; другие
      # контейнеры ходят по сети compose по имени сервиса clickhouse:9000).
      - "${CH_BIND_IP:-127.0.0.1}:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [mdg-net]

  grafana:
    image: grafana/grafana:11.2
    container_name: mdg-grafana
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      # Для provisioning datasource (grafana/provisioning/datasources/clickhouse.yml)
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      - "${CH_BIND_IP:-127.0.0.1}:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks: [mdg-net]

volumes:
  clickhouse_data:
  grafana_data:

networks:
  mdg-net:
    name: mdg-net
    driver: bridge
