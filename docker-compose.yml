services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: mdg-clickhouse
    profiles: ["core"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      # Внутренний сервис (БД): только docker-подсеть, НЕ публичный
      - "${CH_BIND_IP:-127.0.0.1}:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [mdg-net]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: mdg-grafana
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      # Для provisioning datasource (grafana/provisioning/datasources/clickhouse.yml)
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
    ports:
      # Публичный сервис (дашборды): бинд на все интерфейсы; TLS позже — глобальный nginx владельца
      - "${GF_BIND_IP:-127.0.0.1}:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks: [mdg-net]

  redis:
    image: redis:7-alpine
    container_name: mdg-redis
    profiles: ["bot"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [mdg-net]

  telegram-bot:
    image: python:3.12-slim
    container_name: mdg-bot
    profiles: ["bot"]
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID}
      REDIS_URL: redis://redis:6379/0
      TZ: ${TZ:-Europe/Moscow}
    command:
      - sh
      - -c
      - pip install --no-cache-dir -e . "aiogram[proxy]" redis uvloop && exec python -m mdgrabber.bot
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [mdg-net]

  # Разовые cron-задачи (сбор, витрины, watchdog, дайджест) — exec'ом из cron хоста
  jobs:
    image: python:3.12-slim
    container_name: mdg-jobs
    profiles: ["jobs"]
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      REDIS_URL: redis://redis:6379/0
      TZ: ${TZ:-Europe/Moscow}
    command:
      - sh
      - -c
      - pip install --no-cache-dir -e . "httpx[socks]" structlog python-dotenv && sleep infinity
  mcp:
    image: python:3.12.7-slim
    container_name: mdg-mcp
    profiles: ["mcp"]
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      TZ: ${TZ:-Europe/Moscow}
    env_file: .env
    ports:
      # MCP-сервер: читающий API над gold-витринами (аутентификация X-API-Key)
      - "${MCP_BIND_IP:-0.0.0.0}:${MCP_PORT:-8900}:8900"
    command:
      - sh
      - -c
      - pip install --no-cache-dir . "mcp>=1.2.0,<2" uvicorn && exec env PYTHONPATH=src python -m mdgrabber.mcp_server
    healthcheck:
      # TCP-only: /mcp без ключа отвечает 401 — это нормально для живого сервера
      test: ["CMD", "python", "-c", "import socket;socket.create_connection(('127.0.0.1',8900),5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks: [mdg-net]

volumes:
  clickhouse_data:
  grafana_data:

networks:
  mdg-net:
    name: mdg-net
    driver: bridge
