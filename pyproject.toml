[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdgrabber"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27",
    "structlog>=24.1",
    "clickhouse-connect>=0.7",
    "python-dotenv>=1.0",
    "mcp>=1.2.0,<2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
