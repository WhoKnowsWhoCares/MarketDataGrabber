# Provisioning дашбордов: читаем JSON-файлы из смонтированного каталога.
apiVersion: 1

providers:
  - name: marketdata
    orgId: 1
    folder: MarketData
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
